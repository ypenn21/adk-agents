<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soft Micro ADK Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #212529;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --user-message-bg: #0d6efd;
            --user-message-color: #ffffff;
            --agent-message-bg: #e9ecef;
            --agent-message-color: #212529;
            --input-bg: #ffffff;
            --input-border: #ced4da;
        }

        [data-bs-theme="dark"] {
            --bg-color: #212529;
            --text-color: #f8f9fa;
            --card-bg: #343a40;
            --border-color: #495057;
            --user-message-bg: #0d6efd;
            --user-message-color: #ffffff;
            --agent-message-bg: #495057;
            --agent-message-color: #f8f9fa;
            --input-bg: #495057;
            --input-border: #6c757d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .chat-container {
            max-width: 800px;
            margin: 2rem auto;
        }

        .card {
            background-color: var(--card-bg);
            border-color: var(--border-color);
        }

        #conversation {
            height: 60vh;
            overflow-y: auto;
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .message {
            margin-bottom: 1rem;
            padding: 0.75rem 1.25rem;
            border-radius: 1.25rem;
            max-width: 80%;
            word-wrap: break-word;
        }

        .user-message {
            background-color: var(--user-message-bg);
            color: var(--user-message-color);
            margin-left: auto;
            border-bottom-right-radius: 0.25rem;
        }

        .agent-message {
            background-color: var(--agent-message-bg);
            color: var(--agent-message-color);
            margin-right: auto;
            border-bottom-left-radius: 0.25rem;
        }

        #pendingIndicator {
            display: none;
        }

        .spinner-border {
            width: 1rem;
            height: 1rem;
        }

        .agent-message table {
            width: 100%;
            margin-top: 1rem;
            background-color: var(--input-bg);
        }
    </style>
</head>
<body>
    <div class="container chat-container">
        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h1 class="h5 mb-0">Soft Micro Bug Agent</h1>
                <button class="btn btn-sm btn-outline-secondary" id="theme-toggler">Toggle Theme</button>
            </div>
            <div class="card-body">
                <div id="conversation">
                    <div class="message agent-message">Hello! How can I help you today?</div>
                </div>
                <div id="pendingIndicator" class="text-center py-2">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
                <div class="input-group p-3">
                    <input type="text" id="messageInput" class="form-control" placeholder="Type your message...">
                    <button class="btn btn-primary" id="sendButton">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Theme switcher logic
        const themeToggler = document.getElementById('theme-toggler');
        const currentTheme = localStorage.getItem('theme');

        if (currentTheme) {
            document.documentElement.setAttribute('data-bs-theme', currentTheme);
        }

        themeToggler.addEventListener('click', () => {
            let theme = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem('theme', theme);
        });


        let sessionId = sessionStorage.getItem('adk_chat_session_id');
        if (!sessionId) {
            sessionId = self.crypto.randomUUID();
            sessionStorage.setItem('adk_chat_session_id', sessionId);
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            const conversation = document.getElementById('conversation');

            const userMessageDiv = document.createElement('div');
            userMessageDiv.classList.add('message', 'user-message');
            userMessageDiv.textContent = message;
            conversation.appendChild(userMessageDiv);
            conversation.scrollTop = conversation.scrollHeight;

            input.value = '';
            input.disabled = true;
            document.getElementById('sendButton').disabled = true;
            document.getElementById('pendingIndicator').style.display = 'block';

            const payload = {
                appName: "AgentBugAssistant",
                userId: "user_123",
                sessionId: sessionId,
                newMessage: {
                    role: "user",
                    parts: [{ text: message }]
                },
                streaming: false
            };

            try {
                const response = await fetch('{% url "interact_with_agent" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                appendAgentMessage(data.content.parts[0].text, 'agent-message');
            } catch (error) {
                console.error('Error:', error);
                appendAgentMessage(`Error: ${error.message}`, 'agent-message');
            } finally {
                document.getElementById('pendingIndicator').style.display = 'none';
                input.disabled = false;
                document.getElementById('sendButton').disabled = false;
                input.focus();
                conversation.scrollTop = conversation.scrollHeight;
            }
        }

        function parseMarkdownTable(markdown) {
            const lines = markdown.trim().split('\n').map(line => line.trim());
            if (lines.length < 2) return null;

            const table = document.createElement('table');
            table.classList.add('table', 'table-bordered', 'table-striped');
            const thead = document.createElement('thead');
            const tbody = document.createElement('tbody');
            table.appendChild(thead);
            table.appendChild(tbody);

            function getCells(lineString) {
                if (!lineString.startsWith('|') || !lineString.endsWith('|')) {
                    return null;
                }
                const content = lineString.slice(1, -1);
                return content.split('|').map(cell => cell.trim());
            }

            const headerLine = lines[0];
            const headers = getCells(headerLine);
            if (!headers) return null;

            const trHead = document.createElement('tr');
            headers.forEach(headerText => {
                const th = document.createElement('th');
                th.textContent = headerText;
                trHead.appendChild(th);
            });
            thead.appendChild(trHead);

            for (let i = 2; i < lines.length; i++) {
                const dataLine = lines[i];
                if (dataLine === "") continue;
                const cells = getCells(dataLine);
                if (!cells) continue;

                const trBody = document.createElement('tr');
                cells.forEach(cellText => {
                    const td = document.createElement('td');
                    td.textContent = cellText;
                    trBody.appendChild(td);
                });
                tbody.appendChild(trBody);
            }
            return table;
        }

        function appendAgentMessage(text, className) {
            const conversation = document.getElementById('conversation');
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', className);

            const lines = text.split('\n');
            let currentTextBuffer = [];
            let i = 0;

            function flushTextBuffer() {
                if (currentTextBuffer.length > 0) {
                    const pre = document.createElement('pre');
                    pre.style.whiteSpace = 'pre-wrap';
                    pre.style.fontFamily = 'inherit';
                    pre.textContent = currentTextBuffer.join('\n');
                    messageDiv.appendChild(pre);
                    currentTextBuffer = [];
                }
            }

            while (i < lines.length) {
                const line = lines[i].trim();
                if (line.startsWith('|') && line.endsWith('|')) {
                    let tableLines = [];
                    while (i < lines.length && lines[i].trim().startsWith('|')) {
                        tableLines.push(lines[i]);
                        i++;
                    }
                    flushTextBuffer();
                    const tableElement = parseMarkdownTable(tableLines.join('\n'));
                    if (tableElement) {
                        messageDiv.appendChild(tableElement);
                    }
                } else {
                    currentTextBuffer.push(lines[i]);
                    i++;
                }
            }
            flushTextBuffer();

            if (messageDiv.hasChildNodes()) {
                conversation.appendChild(messageDiv);
                conversation.scrollTop = conversation.scrollHeight;
            }
        }

        document.getElementById('messageInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        document.getElementById('sendButton').addEventListener('click', sendMessage);
    </script>
</body>
</html>
