<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Bug Assistant - AI Support</title>

  <!-- Prevent dark mode flicker / FOUC -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('adk_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- jQuery 3.7.1 CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Marked.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root[data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-secondary: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border-color: #e2e8f0;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --user-bubble-bg: #2563eb;
      --user-bubble-text: #ffffff;
      --bot-bubble-bg: #ffffff;
      --bot-bubble-text: #0f172a;
      --bot-bubble-border: #e2e8f0;
      --code-bg: #1e293b;
      --code-text: #f8fafc;
      --table-border: #cbd5e1;
      --table-stripe: #f8fafc;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-text: #991b1b;
      --status-dot-bg: #10b981;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }

    :root[data-theme="dark"] {
      --bg-primary: #0b0f19;
      --bg-surface: #111827;
      --bg-surface-secondary: #1f2937;
      --text-primary: #f9fafb;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --border-color: #1f2937;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --user-bubble-bg: #2563eb;
      --user-bubble-text: #ffffff;
      --bot-bubble-bg: #1f2937;
      --bot-bubble-text: #f9fafb;
      --bot-bubble-border: #374151;
      --code-bg: #030712;
      --code-text: #f3f4f6;
      --table-border: #374151;
      --table-stripe: #111827;
      --error-bg: #450a0a;
      --error-border: #7f1d1d;
      --error-text: #fecaca;
      --status-dot-bg: #34d399;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4), 0 2px 4px -2px rgb(0 0 0 / 0.4);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5), 0 4px 6px -4px rgb(0 0 0 / 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* App Layout */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      background-color: var(--bg-surface);
      box-shadow: var(--shadow-lg);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-surface);
      flex-shrink: 0;
      z-index: 10;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-color), #4f46e5);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
    }

    .brand-icon svg {
      width: 24px;
      height: 24px;
    }

    .brand-text h1 {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--status-dot-bg);
      display: inline-block;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .theme-toggle-btn {
      background: var(--bg-surface-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .theme-toggle-btn:hover {
      background: var(--border-color);
      color: var(--text-primary);
    }

    .theme-toggle-btn svg {
      width: 20px;
      height: 20px;
    }

    .theme-icon-light {
      display: none;
    }

    .theme-icon-dark {
      display: block;
    }

    :root[data-theme="dark"] .theme-icon-light {
      display: block;
    }

    :root[data-theme="dark"] .theme-icon-dark {
      display: none;
    }

    /* Conversation Area */
    .conversation-wrapper {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      max-width: 85%;
    }

    .message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-row.agent {
      align-self: flex-start;
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .message-avatar.agent-avatar {
      background: linear-gradient(135deg, var(--accent-color), #4f46e5);
      color: #ffffff;
    }

    .message-avatar.user-avatar {
      background: var(--bg-surface-secondary);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }

    .message-content {
      padding: 0.875rem 1.125rem;
      border-radius: 12px;
      font-size: 0.9375rem;
      line-height: 1.55;
      word-break: break-word;
      position: relative;
    }

    .message-row.user .message-content {
      background-color: var(--user-bubble-bg);
      color: var(--user-bubble-text);
      border-top-right-radius: 4px;
      box-shadow: var(--shadow-sm);
    }

    .message-row.agent .message-content {
      background-color: var(--bot-bubble-bg);
      color: var(--bot-bubble-text);
      border: 1px solid var(--bot-bubble-border);
      border-top-left-radius: 4px;
      box-shadow: var(--shadow-sm);
    }

    /* Markdown styling inside Agent message */
    .message-content p {
      margin-bottom: 0.75rem;
    }

    .message-content p:last-child {
      margin-bottom: 0;
    }

    .message-content h1,
    .message-content h2,
    .message-content h3,
    .message-content h4 {
      font-weight: 600;
      margin-top: 0.75rem;
      margin-bottom: 0.5rem;
      color: inherit;
    }

    .message-content ul,
    .message-content ol {
      margin-left: 1.25rem;
      margin-bottom: 0.75rem;
    }

    .message-content li {
      margin-bottom: 0.25rem;
    }

    .message-content code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85em;
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      background-color: var(--bg-surface-secondary);
      color: var(--accent-color);
    }

    .message-content pre {
      background-color: var(--code-bg);
      color: var(--code-text);
      padding: 0.875rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 0.75rem 0;
      font-size: 0.85rem;
    }

    .message-content pre code {
      background-color: transparent;
      color: inherit;
      padding: 0;
    }

    .message-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.75rem 0;
      font-size: 0.875rem;
      border-radius: 6px;
      overflow: hidden;
    }

    .message-content th,
    .message-content td {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--table-border);
      text-align: left;
    }

    .message-content th {
      background-color: var(--bg-surface-secondary);
      font-weight: 600;
    }

    .message-content tr:nth-child(even) td {
      background-color: var(--table-stripe);
    }

    .message-content blockquote {
      border-left: 3px solid var(--accent-color);
      padding-left: 0.75rem;
      margin: 0.75rem 0;
      color: var(--text-secondary);
      font-style: italic;
    }

    /* Error Bubble */
    .message-row.error .message-content {
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    /* Loading Indicator */
    .loading-indicator {
      display: none;
      align-self: flex-start;
      margin-left: 2.75rem;
      margin-bottom: 0.5rem;
    }

    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0.625rem 1rem;
      background-color: var(--bot-bubble-bg);
      border: 1px solid var(--bot-bubble-border);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      background-color: var(--accent-color);
      border-radius: 50%;
      display: inline-block;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing-dots span:nth-child(1) {
      animation-delay: -0.32s;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: scale(0);
      }
      40% {
        transform: scale(1.0);
      }
    }

    /* Input Footer */
    footer.chat-input-area {
      padding: 1rem 1.5rem;
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 0.75rem;
      background-color: var(--bg-surface-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.5rem 0.75rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-wrapper:focus-within {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }

    #messageInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 0.9375rem;
      line-height: 1.4;
      resize: none;
      max-height: 120px;
      min-height: 24px;
      padding: 0.25rem 0;
    }

    #messageInput::placeholder {
      color: var(--text-muted);
    }

    #sendButton {
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s ease, opacity 0.2s ease;
      flex-shrink: 0;
    }

    #sendButton:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #sendButton svg {
      width: 18px;
      height: 18px;
    }

    .input-hint {
      display: flex;
      justify-content: space-between;
      margin-top: 0.375rem;
      padding: 0 0.25rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    @media (max-width: 640px) {
      .app-container {
        border: none;
        border-radius: 0;
      }
      .message-row {
        max-width: 92%;
      }
      .conversation-wrapper {
        padding: 1rem;
      }
      footer.chat-input-area {
        padding: 0.75rem 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="app-container" id="app-container">
    <!-- App Header -->
    <header>
      <div class="header-brand">
        <div class="brand-icon">
          <!-- Robot Icon -->
          <svg fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h2a6 6 0 0 1 6 6v1h1a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-1v1a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-1H3a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2h1v-1a6 6 0 0 1 6-6h2V5.73A2 2 0 0 1 12 2zm-3 9a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 8a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-1H8v1z"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>IT Bug Assistant</h1>
          <div class="status-pill">
            <span class="status-dot"></span>
            <span>Online</span>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle theme" title="Toggle dark/light mode">
          <!-- Moon Icon (for Light Mode, switches to Dark) -->
          <svg class="theme-icon-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
          </svg>
          <!-- Sun Icon (for Dark Mode, switches to Light) -->
          <svg class="theme-icon-light" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 9H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Conversation History -->
    <main class="conversation-wrapper" id="conversation" role="log" aria-live="polite">
      <!-- Welcome Message from Agent -->
      <div class="message-row agent">
        <div class="message-avatar agent-avatar" aria-hidden="true">AI</div>
        <div class="message-content">
          <p><strong>Welcome to the IT Bug Assistant!</strong></p>
          <p>I can help you investigate software defects, search existing bug reports in the PostgreSQL database, triage issues, or look up technical documentation. How can I help you today?</p>
        </div>
      </div>
    </main>

    <!-- Typing Indicator -->
    <div class="loading-indicator" id="loadingIndicator" aria-hidden="true">
      <div class="typing-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <!-- Chat Input Area -->
    <footer class="chat-input-area" id="inputContainer">
      <form id="chatForm" onsubmit="return false;">
        <div class="input-wrapper">
          <textarea id="messageInput" rows="1" placeholder="Ask about bugs, issues, or ticket status..." aria-label="Message"></textarea>
          <button type="button" id="sendButton" aria-label="Send message" title="Send message">
            <!-- Send Airplane Icon -->
            <svg fill="currentColor" viewBox="0 0 24 24">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </div>
        <div class="input-hint">
          <span>Shift + Enter for new line</span>
          <span>Powered by Google ADK &amp; Gemini</span>
        </div>
      </form>
    </footer>
  </div>

  <script>
    $(document).ready(function() {
      const $conversation = $('#conversation');
      const $messageInput = $('#messageInput');
      const $sendButton = $('#sendButton');
      const $loadingIndicator = $('#loadingIndicator');
      const $themeToggle = $('#themeToggle');

      // 1. Session Management via sessionStorage
      function getOrCreateSessionId() {
        let sessionId = sessionStorage.getItem('adk_chat_session_id');
        if (!sessionId) {
          if (window.crypto && window.crypto.randomUUID) {
            sessionId = window.crypto.randomUUID();
          } else {
            sessionId = 'session_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
          }
          sessionStorage.setItem('adk_chat_session_id', sessionId);
        }
        return sessionId;
      }

      const sessionId = getOrCreateSessionId();

      // 2. Theme Switching Logic
      $themeToggle.on('click', function() {
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('adk_theme', newTheme);
      });

      // 3. Auto Scroll to bottom
      function scrollToBottom() {
        $conversation.scrollTop($conversation[0].scrollHeight);
      }

      // 4. Append Message to Conversation
      function appendMessage(role, text) {
        let messageHtml = '';
        if (role === 'user') {
          // Escape HTML for user input to prevent XSS
          const escapedText = $('<div/>').text(text).html();
          messageHtml = `
            <div class="message-row user">
              <div class="message-avatar user-avatar" aria-hidden="true">You</div>
              <div class="message-content">
                <p>${escapedText.replace(/\n/g, '<br>')}</p>
              </div>
            </div>
          `;
        } else if (role === 'agent') {
          // Parse markdown for agent response
          let parsedMarkdown = '';
          try {
            parsedMarkdown = marked.parse(text);
          } catch (e) {
            parsedMarkdown = $('<div/>').text(text).html();
          }
          messageHtml = `
            <div class="message-row agent">
              <div class="message-avatar agent-avatar" aria-hidden="true">AI</div>
              <div class="message-content">
                ${parsedMarkdown}
              </div>
            </div>
          `;
        } else if (role === 'error') {
          const escapedError = $('<div/>').text(text).html();
          messageHtml = `
            <div class="message-row agent error">
              <div class="message-avatar agent-avatar" aria-hidden="true">!</div>
              <div class="message-content">
                <p><strong>Error:</strong> ${escapedError}</p>
              </div>
            </div>
          `;
        }

        $conversation.append(messageHtml);
        scrollToBottom();
      }

      // 5. Auto-expand textarea height
      $messageInput.on('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
      });

      // 6. Handle Send Message
      function sendMessage() {
        const text = $messageInput.val().trim();
        if (!text) return;

        // Append User Message
        appendMessage('user', text);

        // Reset input field
        $messageInput.val('').css('height', 'auto');

        // Disable input controls & Show loading indicator
        $messageInput.prop('disabled', true);
        $sendButton.prop('disabled', true);
        $loadingIndicator.show();
        scrollToBottom();

        // Construct ADK request payload conforming to openapi.yaml
        const payload = {
          appName: "AgentBugAssistant",
          userId: "user_default",
          sessionId: sessionId,
          newMessage: {
            role: "user",
            parts: [
              {
                text: text
              }
            ]
          },
          streaming: false
        };

        $.ajax({
          url: "{% url 'interact_with_agent' %}",
          type: "POST",
          contentType: "application/json",
          data: JSON.stringify(payload),
          dataType: "json",
          success: function(response) {
            if (response && response.content && response.content.parts && response.content.parts.length > 0) {
              const replyText = response.content.parts[0].text;
              appendMessage('agent', replyText);
            } else {
              appendMessage('agent', "Received an empty response from the assistant.");
            }
          },
          error: function(xhr, status, error) {
            let errorMsg = "Unable to reach the assistant service. Please try again.";
            if (xhr.responseJSON && xhr.responseJSON.error) {
              errorMsg = xhr.responseJSON.error;
            }
            appendMessage('error', errorMsg);
          },
          complete: function() {
            $loadingIndicator.hide();
            $messageInput.prop('disabled', false);
            $sendButton.prop('disabled', false);
            $messageInput.focus();
            scrollToBottom();
          }
        });
      }

      // 7. Event Listeners
      $sendButton.on('click', function(e) {
        e.preventDefault();
        sendMessage();
      });

      $messageInput.on('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // Initial focus
      $messageInput.focus();
    });
  </script>
</body>
</html>
