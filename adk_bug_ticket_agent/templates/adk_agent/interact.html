<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Bug Assistant - AI Support</title>

  <!-- Prevent dark mode flicker / FOUC -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('adk_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- jQuery 3.7.1 CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Marked.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root[data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --bg-header: #ffffff;
      --bg-input: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --bubble-user: #2563eb;
      --bubble-user-text: #ffffff;
      --bubble-agent: #ffffff;
      --bubble-agent-text: #1e293b;
      --table-stripe: #f1f5f9;
      --code-bg: #1e293b;
      --code-text: #f8fafc;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
    }

    :root[data-theme="dark"] {
      --bg-primary: #0b0f19;
      --bg-card: #151d2f;
      --bg-header: #151d2f;
      --bg-input: #151d2f;
      --border-color: #243049;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --bubble-user: #3b82f6;
      --bubble-user-text: #ffffff;
      --bubble-agent: #1e293b;
      --bubble-agent-text: #e2e8f0;
      --table-stripe: #1e293b;
      --code-bg: #0f172a;
      --code-text: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* App Header */
    header {
      background-color: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      padding: 0.875rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
      z-index: 10;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 0.875rem;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-icon svg {
      width: 24px;
      height: 24px;
    }

    .brand-text h1 {
      font-size: 1.125rem;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-main);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #10b981;
      display: inline-block;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .theme-toggle-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .theme-toggle-btn:hover {
      background-color: var(--table-stripe);
    }

    .theme-toggle-btn svg {
      width: 18px;
      height: 18px;
    }

    /* Main Container */
    #app-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      height: calc(100vh - 65px);
      position: relative;
    }

    /* Conversation Area */
    #conversation {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.agent {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 82%;
      padding: 0.875rem 1.125rem;
      border-radius: 14px;
      font-size: 0.9375rem;
      line-height: 1.6;
      word-wrap: break-word;
      box-shadow: var(--shadow);
    }

    .message-row.user .message-bubble {
      background-color: var(--bubble-user);
      color: var(--bubble-user-text);
      border-bottom-right-radius: 4px;
    }

    .message-row.agent .message-bubble {
      background-color: var(--bubble-agent);
      color: var(--bubble-agent-text);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }

    .message-row.agent .message-bubble.error {
      border-color: #ef4444;
      background-color: rgba(239, 68, 68, 0.08);
      color: #ef4444;
    }

    /* Markdown Styling inside agent bubbles */
    .message-bubble p {
      margin-bottom: 0.75rem;
    }

    .message-bubble p:last-child {
      margin-bottom: 0;
    }

    .message-bubble ul, .message-bubble ol {
      margin-left: 1.5rem;
      margin-bottom: 0.75rem;
    }

    .message-bubble ul:last-child, .message-bubble ol:last-child {
      margin-bottom: 0;
    }

    .message-bubble table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.875rem 0;
      font-size: 0.875rem;
      overflow-x: auto;
      display: block;
    }

    .message-bubble th, .message-bubble td {
      border: 1px solid var(--border-color);
      padding: 0.5rem 0.75rem;
      text-align: left;
    }

    .message-bubble th {
      background-color: var(--table-stripe);
      font-weight: 600;
    }

    .message-bubble tr:nth-child(even) {
      background-color: var(--table-stripe);
    }

    .message-bubble code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85em;
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      background-color: rgba(0, 0, 0, 0.08);
    }

    :root[data-theme="dark"] .message-bubble code {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .message-bubble pre {
      background-color: var(--code-bg);
      color: var(--code-text);
      padding: 0.875rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 0.75rem 0;
    }

    .message-bubble pre code {
      background-color: transparent;
      padding: 0;
      color: inherit;
    }

    /* Loading Indicator */
    #pendingIndicator {
      display: none;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .dots {
      display: inline-flex;
      gap: 4px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1.0); }
    }

    /* Input Area */
    #inputArea {
      padding: 1rem;
      background-color: var(--bg-header);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 0.75rem;
    }

    #inputContainer {
      display: flex;
      width: 100%;
      gap: 0.75rem;
    }

    #messageInput {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-input);
      color: var(--text-main);
      font-size: 0.9375rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #messageInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    #messageInput:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #sendButton {
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 0 1.25rem;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: background-color 0.2s;
    }

    #sendButton:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    #sendButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #sendButton svg {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header>
    <div class="header-brand">
      <div class="brand-icon">
        <!-- Robot Icon -->
        <svg fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h2a6 6 0 0 1 6 6v1h1a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-1v1a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-1H3a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2h1v-1a6 6 0 0 1 6-6h2V5.73A2 2 0 0 1 12 2zm-3 9a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 8a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-1H8v1z"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>IT Bug Assistant</h1>
        <div class="status-pill">
          <span class="status-dot"></span>
          <span>Online</span>
        </div>
      </div>
    </div>

    <div class="header-actions">
      <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle Theme" title="Toggle dark/light mode">
        <!-- Sun icon (shown in dark mode) -->
        <svg id="sunIcon" style="display: none;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- Moon icon (shown in light mode) -->
        <svg id="moonIcon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main id="app-container">
    <div id="conversation">
      <!-- Welcome message -->
      <div class="message-row agent">
        <div class="message-bubble">
          Hello! I am your <strong>IT Bug Assistant</strong>. How can I help you triage, search, or update bug tickets today?
        </div>
      </div>
    </div>

    <!-- Thinking/Loading indicator -->
    <div id="pendingIndicator">
      <div class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <span>Agent is thinking...</span>
    </div>

    <!-- Input Area -->
    <div id="inputArea">
      <div id="inputContainer">
        <input type="text" id="messageInput" placeholder="Describe the issue or ask about a bug ticket..." autocomplete="off">
        <button id="sendButton">
          <span>Send</span>
          <svg fill="currentColor" viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>
  </main>

  <!-- jQuery Chat Controller -->
  <script>
    $(document).ready(function() {
      // 1. Theme Management
      function updateThemeIcons(theme) {
        if (theme === 'dark') {
          $('#sunIcon').show();
          $('#moonIcon').hide();
        } else {
          $('#sunIcon').hide();
          $('#moonIcon').show();
        }
      }

      const initialTheme = document.documentElement.getAttribute('data-theme') || 'light';
      updateThemeIcons(initialTheme);

      $('#themeToggle').on('click', function() {
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
        const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', nextTheme);
        localStorage.setItem('adk_theme', nextTheme);
        updateThemeIcons(nextTheme);
      });

      // 2. Session ID Management
      function getSessionId() {
        let sid = sessionStorage.getItem('adk_chat_session_id');
        if (!sid) {
          if (window.crypto && window.crypto.randomUUID) {
            sid = window.crypto.randomUUID();
          } else {
            sid = 'session-' + Date.now() + '-' + Math.random().toString(36).substring(2, 9);
          }
          sessionStorage.setItem('adk_chat_session_id', sid);
        }
        return sid;
      }

      function scrollToBottom() {
        const conv = $('#conversation');
        conv.scrollTop(conv[0].scrollHeight);
      }

      // 3. Message Bubble Appending
      function appendMessage(role, content, isError = false) {
        const rowClass = role === 'user' ? 'message-row user' : 'message-row agent';
        const errorClass = isError ? ' error' : '';
        const renderedHtml = role === 'user' ? $('<div>').text(content).html() : marked.parse(content);
        
        const messageRow = $(`
          <div class="${rowClass}">
            <div class="message-bubble${errorClass}">
              ${renderedHtml}
            </div>
          </div>
        `);
        
        $('#conversation').append(messageRow);
        scrollToBottom();
      }

      // 4. Send Message Interaction
      function sendMessage() {
        const text = $('#messageInput').val().trim();
        if (!text) return;

        appendMessage('user', text);
        $('#messageInput').val('');

        $('#messageInput').prop('disabled', true);
        $('#sendButton').prop('disabled', true);
        $('#pendingIndicator').css('display', 'flex');
        scrollToBottom();

        const payload = {
          appName: "AgentBugAssistant",
          userId: "user_123",
          sessionId: getSessionId(),
          newMessage: {
            role: "user",
            parts: [{ text: text }]
          },
          streaming: false
        };

        $.ajax({
          url: '{% url "interact_with_agent" %}',
          type: 'POST',
          contentType: 'application/json',
          data: JSON.stringify(payload),
          success: function(data) {
            if (data && data.content && data.content.parts && data.content.parts[0] && data.content.parts[0].text) {
              appendMessage('agent', data.content.parts[0].text);
            } else if (data && data.error) {
              appendMessage('agent', 'Error: ' + data.error, true);
            } else {
              appendMessage('agent', 'Received an empty response from agent.');
            }
          },
          error: function(xhr, status, error) {
            let errorMsg = 'An error occurred while communicating with the server.';
            try {
              const res = JSON.parse(xhr.responseText);
              if (res.error) {
                errorMsg = res.error;
              }
            } catch (e) {}
            appendMessage('agent', 'Error: ' + errorMsg, true);
          },
          complete: function() {
            $('#pendingIndicator').hide();
            $('#messageInput').prop('disabled', false);
            $('#sendButton').prop('disabled', false);
            $('#messageInput').focus();
            scrollToBottom();
          }
        });
      }

      $('#sendButton').on('click', function() {
        sendMessage();
      });

      $('#messageInput').on('keypress', function(e) {
        if (e.which === 13) {
          sendMessage();
        }
      });
    });
  </script>
</body>
</html>
