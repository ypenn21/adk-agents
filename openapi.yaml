openapi: 3.0.0
info:
  title: ADK Agent API
  version: 1.0.0
  description: API for interacting with the IT Bug Assistant Agent
paths:
  /agent/interact/:
    get:
      summary: Get the agent interaction interface
      description: Returns the HTML page for interacting with the agent.
      responses:
        '200':
          description: HTML interaction page
          content:
            text/html:
              schema:
                type: string
    post:
      summary: Interact with the agent
      description: Sends a user message to the agent and receives a response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - appName
                - userId
                - sessionId
                - newMessage
              properties:
                appName:
                  type: string
                  example: "AgentBugAssistant"
                userId:
                  type: string
                  example: "user_123"
                sessionId:
                  type: string
                  example: "session-abc-123"
                newMessage:
                  type: object
                  required:
                    - parts
                  properties:
                    role:
                      type: string
                      example: "user"
                    parts:
                      type: array
                      items:
                        type: object
                        required:
                          - text
                        properties:
                          text:
                            type: string
                            example: "Hello, how can you help me?"
                streaming:
                  type: boolean
                  example: false
      responses:
        '200':
          description: Successful response from the agent
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: object
                    properties:
                      parts:
                        type: array
                        items:
                          type: object
                          properties:
                            text:
                              type: string
                      role:
                        type: string
                  timestamp:
                    type: number
        '400':
          description: Bad Request (Invalid payload or missing fields)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  traceback:
                    type: string

