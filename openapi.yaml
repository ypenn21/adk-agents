openapi: 3.0.0
info:
  title: IT Bug Assistant Agent API
  description: API for the IT Bug Assistant Agent
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000
    description: Local development server
paths:
  /agent/interact/:
    post:
      summary: Interact with the agent
      description: Sends a message to the agent and receives a response.
      tags:
        - Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionRequest'
      responses:
        '200':
          description: Successful response from the agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionResponse'
        '400':
          description: Invalid request
        '500':
          description: Internal server error
components:
  schemas:
    InteractionRequest:
      type: object
      properties:
        appName:
          type: string
          example: "bug-assistant"
        userId:
          type: string
          example: "user123"
        sessionId:
          type: string
          example: "session456"
        newMessage:
          type: object
          properties:
            parts:
              type: array
              items:
                type: object
                properties:
                  text:
                    type: string
                    example: "Show me all the tickets with status Open"
    InteractionResponse:
      type: object
      properties:
        content:
          type: object
          properties:
            parts:
              type: array
              items:
                type: object
                properties:
                  text:
                    type: string
                    example: "I found 5 tickets with the status 'Open'."
            role:
              type: string
              example: "model"
        timestamp:
          type: number
          example: 1678886400
