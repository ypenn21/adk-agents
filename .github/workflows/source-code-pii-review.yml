name: Source Code PII and Code Review

on:
  # push:
  #   branches: [ main ]
  pull_request: # trigger
    types:
      - opened
      - synchronize

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  APP_ID: ${{ secrets.APP_ID }}
  APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
  GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT || vars.GCP_PROJECT_ID }}
  GOOGLE_CLOUD_PROJECT_NUMBER: ${{ secrets.GOOGLE_CLOUD_PROJECT_NUMBER || vars.GCP_PROJECT_NUMBER }}
  GOOGLE_GENAI_USE_VERTEXAI: 'true'
  GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION || 'us-central1' }}
  LLM_Model: ${{ vars.LLM_MODEL || vars.LLM_Model || secrets.LLM_MODEL || secrets.LLM_Model || 'gemini-3.7-flash' }}
  MAX_TOTAL_TOKENS: ${{ vars.MAX_TOTAL_TOKENS || secrets.MAX_TOTAL_TOKENS || '1100000' }}
  MAX_INPUT_TOKENS: ${{ vars.MAX_INPUT_TOKENS || secrets.MAX_INPUT_TOKENS || '800000' }}
  MAX_OUTPUT_TOKENS: ${{ vars.MAX_OUTPUT_TOKENS || secrets.MAX_OUTPUT_TOKENS || '200000' }}
  MAX_MODEL_CALLS: ${{ vars.MAX_MODEL_CALLS || secrets.MAX_MODEL_CALLS || '100' }}
  MAX_TOOL_CALLS: ${{ vars.MAX_TOOL_CALLS || secrets.MAX_TOOL_CALLS || '50' }}
  MAX_SPEND_USD: ${{ vars.MAX_SPEND_USD || secrets.MAX_SPEND_USD || '' }}
  PR_REVIEW_PROMPT_VERSION: ${{ vars.PR_REVIEW_PROMPT_VERSION || secrets.PR_REVIEW_PROMPT_VERSION || '1.0.0' }}
  QUALITY_GATE_PROMPT_VERSION: ${{ vars.QUALITY_GATE_PROMPT_VERSION || secrets.QUALITY_GATE_PROMPT_VERSION || '1.0.0' }}

jobs:
  scan-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud (WIF)'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ env.GOOGLE_CLOUD_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/aaa-github-pool/providers/github-provider'
          service_account: '${{ env.GOOGLE_CLOUD_PROJECT_NUMBER }}-compute@developer.gserviceaccount.com'
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}

      - name: Generate GitHub App Token
        if: env.APP_ID != '' && env.APP_PRIVATE_KEY != ''
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          install_components: 'alpha'

      - name: 'Verify Authentication'
        run: gcloud auth list

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python SDK and dependencies
        run: |
          pip install google-antigravity "pydantic>=2.0.0,<3.0.0" pyyaml

      - name: 'Google Cloud DLP Sensitive Data & PII Scan'
        run: |
          python .github/scripts/dlp_scan.py

      - name: 'Run PR Auto-Review via Antigravity Code Reviewer'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.G_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.G_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ steps.app-token.outputs.token || secrets.G_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          MAX_TOTAL_TOKENS: ${{ env.MAX_TOTAL_TOKENS }}
          MAX_INPUT_TOKENS: ${{ env.MAX_INPUT_TOKENS }}
          MAX_OUTPUT_TOKENS: ${{ env.MAX_OUTPUT_TOKENS }}
          MAX_MODEL_CALLS: ${{ env.MAX_MODEL_CALLS }}
          MAX_TOOL_CALLS: ${{ env.MAX_TOOL_CALLS }}
          MAX_SPEND_USD: ${{ env.MAX_SPEND_USD }}
        run: |
          python .github/scripts/pr_reviewer_agent.py

      - name: 'Quality Gate Decision via Release Engineer Agent'
        env:
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python .github/scripts/quality_gate_agent.py

      - name: 'Generate GitHub Actions Job Summary'
        if: always()
        env:
          GOOGLE_CLOUD_PROJECT: ${{ env.GOOGLE_CLOUD_PROJECT }}
        run: |
          python .github/scripts/generate_job_summary.py

      - name: 'Upload Audit Reports & Telemetry to GCS'
        if: always()
        uses: 'google-github-actions/upload-cloud-storage@v2'
        with:
          path: 'reports'
          destination: '${{ env.GOOGLE_CLOUD_PROJECT }}-scan-reports/${{ github.run_id }}_${{ github.run_attempt }}'

      - name: 'Enforce Quality Gate'
        run: |
          if [ ! -f reports/gate-decision.json ]; then
            echo "❌ Gate decision artifact missing!"
            exit 1
          fi
          PASSED=$(python -c "import json; print(json.load(open('reports/gate-decision.json')).get('passed', False))")
          if [ "$PASSED" != "True" ]; then
            echo "❌ Quality Gate Failed! Halting deployment."
            cat reports/decision.txt 2>/dev/null || true
            exit 1
          fi
          echo "✅ Quality Gate Passed successfully!"
  build:
    needs: scan-and-evaluate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud (WIF)'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ env.GOOGLE_CLOUD_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/aaa-github-pool/providers/github-provider'
          service_account: '${{ env.GOOGLE_CLOUD_PROJECT_NUMBER }}-compute@developer.gserviceaccount.com'
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Submit Cloud Build'
        run: |
          gcloud builds submit \
            --config .cloudbuild/cloudbuild-django.yaml \
            --project ${{ env.GOOGLE_CLOUD_PROJECT }} \
            .