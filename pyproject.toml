[project]
name = "adk-agent"
version = "1.17.0"
description = "ADK Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk[db]>=1.27.4",
    "a2a-sdk>=0.3.22",
    "python-dotenv==1.1.0",
    "toolbox-core==0.5.2",
    "gunicorn",
    "whitenoise[brotli]",
    "django>=5.0,<5.3",
    "google-generativeai>=0.8.5",
    "psycopg2-binary",
    "litellm>=1.81.4",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.3",
    "pydantic>=2.6.4",
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

